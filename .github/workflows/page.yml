name: page

# `maca build` writes one file: `build/index.html` carries the stylesheet, the
# program and the icon component inside it, so the page opens from a download
# with nothing beside it. Every push keeps it as an artifact; a version tag
# attaches it to the release.
on:
  push:
    branches: [main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pleahmacaka/macalang@main
      - run: maca build

      - uses: actions/upload-artifact@v4
        with:
          name: tabpane
          path: build/index.html
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/index.html
